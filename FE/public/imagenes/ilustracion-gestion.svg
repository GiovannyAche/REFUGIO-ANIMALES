<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <!-- Fondo circular acorde a la paleta -->
  <circle cx="250" cy="200" r="160" fill="#1E293B" stroke="#334155" stroke-width="4"/>
  
  <!-- Base de datos y nodos interconectados (Gestión de información / MySQL / Node.js) -->
  <g transform="translate(135, 100)">
    <!-- Servidor / Base de datos (cilindros apilados) -->
    <path d="M 70 30 C 70 20, 130 20, 130 30 L 130 60 C 130 70, 70 70, 70 60 Z" fill="#0EA5E9"/>
    <path d="M 70 65 C 70 55, 130 55, 130 65 L 130 95 C 130 105, 70 105, 70 95 Z" fill="#0EA5E9" opacity="0.8"/>
    <path d="M 70 100 C 70 90, 130 90, 130 100 L 130 130 C 130 140, 70 140, 70 130 Z" fill="#0EA5E9" opacity="0.6"/>
    
    <!-- Líneas de flujo de datos hacia tableros de control -->
    <path d="M 40 45 L 70 45" stroke="#10B981" stroke-width="4" stroke-linecap="round"/>
    <path d="M 130 80 L 160 80" stroke="#10B981" stroke-width="4" stroke-linecap="round"/>
    <path d="M 40 115 L 70 115" stroke="#10B981" stroke-width="4" stroke-linecap="round"/>

    <!-- Nodos flotantes de control de registros de adopción -->
    <circle cx="20" cy="45" r="10" fill="#F8FAFC"/>
    <circle cx="180" cy="80" r="10" fill="#F8FAFC"/>
    <circle cx="25" cy="115" r="10" fill="#F8FAFC"/>
  </g>

  <!-- Panel flotante de estadísticas o trazabilidad -->
  <g transform="translate(165, 260)">
    <rect x="0" y="0" width="170" height="40" rx="8" fill="#0F172A" stroke="#334155" stroke-width="2"/>
    <rect x="15" y="12" width="60" height="16" rx="4" fill="#10B981"/>
    <rect x="85" y="15" width="70" height="10" rx="3" fill="#94A3B8"/>
  </g>
</svg>
