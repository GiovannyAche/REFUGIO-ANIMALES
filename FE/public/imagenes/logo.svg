<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="100%" height="100%">
  <!-- Isotipo: Escudo / Cuidado animal combinado con nodo digital -->
  <g transform="translate(10, 8)">
    <!-- Escudo de fondo (Símbolo de protección institucional) -->
    <path d="M 20 2 C 20 2, 40 2, 40 20 C 40 32, 20 44, 20 44 C 20 44, 0 32, 0 20 C 0 2, 20 2, 20 2 Z" fill="#1E293B" stroke="#0EA5E9" stroke-width="2.5"/>
    
    <!-- Huella estilizada combinada con un corazón (Bienestar animal) -->
    <circle cx="20" cy="16" r="5" fill="#10B981"/>
    <circle cx="13" cy="23" r="3.5" fill="#10B981"/>
    <circle cx="27" cy="23" r="3.5" fill="#10B981"/>
    <path d="M 20 32 C 20 32, 12 26, 12 21 C 12 18, 15 17, 17 19 C 19 21, 20 23, 20 23 C 20 23, 21 21, 23 19 C 25 17, 28 18, 28 21 C 28 26, 20 32, 20 32 Z" fill="#0EA5E9" transform="translate(0, -4) scale(0.65) translate(6, 12)"/>
  </g>

  <!-- Logotipo en Texto (Tipografía corporativa limpia) -->
  <g transform="translate(60, 25)">
    <text x="0" y="0" fill="#F8FAFC" font-family="Arial, sans-serif" font-weight="bold" font-size="16" letter-spacing="0.5">Bienestar</text>
    <text x="0" y="16" fill="#0EA5E9" font-family="Arial, sans-serif" font-weight="bold" font-size="13" letter-spacing="1">BOGOTÁ</text>
  </g>
</svg>
